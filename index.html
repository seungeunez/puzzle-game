<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4x4 과일 카드 게임</title>
  <link rel="icon" href="./favicon.ico?v=2" type="image/x-icon">
  <link rel="shortcut icon" href="./favicon.ico?v=2" type="image/x-icon">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="app">
    <section class="game-panel">
      <h1>과일 카드 짝맞추기</h1>
      <p class="description">
        카드를 클릭해서 뒤집고, 같은 과일이 나오는 짝을 찾으세요. 16장 중 8쌍을 맞추면 게임 클리어입니다.
      </p>

      <div class="status-card">
        <div>
          <p class="status-label">시도 횟수</p>
          <strong id="try-count">0</strong>
        </div>
        <div>
          <p class="status-label">짝 맞춘 개수</p>
          <strong id="pair-count">0 / 8</strong>
        </div>
        <div>
          <p class="status-label">최고 기록</p>
          <strong id="best-score">-</strong>
        </div>
      </div>

      <div class="controls">
        <button id="shuffle-button" class="primary-button" type="button">새 게임</button>
      </div>

      <div class="board-shell">
        <div id="memory-board" class="board" aria-label="4 by 4 fruit card board"></div>
      </div>

      <p id="message" class="message" aria-live="polite">
        카드를 클릭해서 같은 과일을 찾아보세요.
      </p>
    </section>
  </main>

  <dialog id="clear-dialog" class="clear-dialog">
    <div class="dialog-content">
      <p class="dialog-label">완료</p>
      <h2>게임 클리어</h2>
      <p id="result-text">완료!</p>
      <button id="restart-button" class="primary-button" type="button">다시 시작</button>
    </div>
  </dialog>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
